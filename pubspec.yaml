name: land_archive
description: A Flutter application for archiving land documents with AI capabilities
version: 3.0.0+16
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # Storage & Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  
  # Image Handling
  image_picker: ^1.0.4
  image: ^4.1.3
  
  # PDF & Printing
  printing: ^5.11.1
  pdf: ^3.10.7
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  
  # Notifications
  flutter_local_notifications: ^16.2.0
  
  # Utilities
  intl: ^0.18.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  # Add assets here
  # assets:
  #   - images/
  #   - assets/
